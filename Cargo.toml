[package]
name = "mizeria"
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/samhdev/mizeria"
homepage = "https://github.com/samhdev/mizeria"
documentation = "https://docs.rs/mizeria"
description = "Prototype cucumber-style BDD runner for Rust"

[workspace]
members = ["examples/orders-app"]
resolver = "2"

[features]
default = ["dialects", "colour", "prelude", "regex"]
# Embed the full official Gherkin dialect catalog. Without this feature only English is available.
dialects = []
# ANSI-coloured completion printer (`ColourSyncPrinter` / default `Printer`).
colour = ["dep:console"]
# Re-exports common types via `mizeria::prelude`.
prelude = []
# Regex step matchers (`Regex` / `re`). Without this, only exact-string statements.
regex = ["dep:regex"]
# Legacy Cucumber JSON listener (`listener::JsonReporter`).
json = ["dep:serde", "dep:serde_json"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
console = { version = "0.16", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pollster = "0.4"
regex = { version = "1.13.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5"
tokio = { version = "1", features = ["macros", "rt"] }

[[example]]
name = "withdrawing_cash"
required-features = ["prelude", "regex", "dialects"]

[[example]]
name = "cukes"
required-features = ["prelude", "regex"]

[[bench]]
name = "hot_path"
harness = false
required-features = ["regex"]
